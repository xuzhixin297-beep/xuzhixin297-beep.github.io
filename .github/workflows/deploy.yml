
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ensure translation cache exists
        run: |
          mkdir -p scripts
          if [ ! -f scripts/translation_cache.json ]; then
            echo "{}" > scripts/translation_cache.json
          fi

      - name: Check translation credentials
        env:
          ZH_API_KEY: ${{ secrets.ZH_API_KEY }}
        run: |
          if [ -z "$ZH_API_KEY" ]; then
            echo "::error::Missing repository secret ZH_API_KEY."
            echo "Add a DeepSeek API key as the repository secret"
            echo "ZH_API_KEY (Settings -> Secrets and variables ->"
            echo "Actions -> New repository secret) so the Chinese"
            echo "translation step can run on every push."
            exit 1
          fi
          echo "Translation API credentials are configured."

      - name: Translate Markdown articles
        env:
          ZH_API_BASE: https://api.deepseek.com
          ZH_API_KEY: ${{ secrets.ZH_API_KEY }}
          ZH_MODEL: deepseek-chat
        run: |
          python scripts/markdown_translator.py

      - name: Install Node dependencies
        run: npm ci

      - name: Build Astro website
        run: npm run build

      - name: Translate entire website HTML
        env:
          ZH_API_BASE: https://api.deepseek.com
          ZH_API_KEY: ${{ secrets.ZH_API_KEY }}
          ZH_MODEL: deepseek-chat
        run: |
          python scripts/site_html_translator.py

      - name: Save translation cache to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scripts/translation_cache.json

          if git diff --cached --quiet -- scripts/translation_cache.json; then
            echo "Translation cache unchanged. Nothing to commit."
          else
            git commit -m "Update translation cache [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
